<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="t d">
  <title id="t">GenPet architecture: the host interface</title>
  <desc id="d">The shared story code calls one host interface with four functions. The desktop and Dots adapters implement it; each step is done by the runtime or by the Agent. Below, the four appearance checks; finish-story requires the second.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 13.5px; font-weight: 600; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .step { font-size: 12px; }
    .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .flow { stroke: #4A5646; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
  </defs>

  <rect width="1000" height="690" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="689" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- legend -->
  <text class="sub" x="40" y="31">Who does each step:</text>
  <rect x="170" y="18" width="62" height="18" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="tag" x="201" y="30.5" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
  <rect x="244" y="18" width="52" height="18" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
  <text class="tag" x="270" y="30.5" text-anchor="middle" fill="#2F4F8A">AGENT</text>
  <rect x="308" y="18" width="62" height="18" rx="4" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="tag" x="339" y="30.5" text-anchor="middle" fill="#8A5A00">TO TEST</text>
  <text class="sub" x="380" y="31">runtime if the host lets it, otherwise the Agent; decided by host tests</text>

  <!-- shared story code and port -->
  <rect x="40" y="58" width="250" height="78" rx="8" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="name" x="165" y="90" text-anchor="middle">Shared story code</text>
  <text class="sub" x="165" y="110" text-anchor="middle">plan · artwork · finish; depends on no host</text>
  <path class="flow" d="M290 97H338" marker-end="url(#a)"/>

  <rect x="340" y="58" width="620" height="78" rx="8" fill="#F3F8EA" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="layer" x="360" y="82" fill="#4E6B22">HOST INTERFACE</text>
  <text class="where" x="486" y="82">one adapter per host</text>
  <rect x="360" y="94" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="cmd" x="423" y="113.5" text-anchor="middle">validateArt</text>
  <rect x="498" y="94" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="cmd" x="573" y="113.5" text-anchor="middle">findAvatar</text>
  <rect x="660" y="94" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="cmd" x="723" y="113.5" text-anchor="middle">setAppearance</text>
  <rect x="798" y="94" width="142" height="30" rx="6" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="cmd" x="869" y="113.5" text-anchor="middle">diagnose</text>

  <path class="flow" d="M500 136V160" marker-end="url(#a)"/>
  <path class="flow" d="M800 136V160" marker-end="url(#a)"/>

  <!-- desktop adapter -->
  <rect x="40" y="162" width="470" height="330" rx="10" fill="#FAFBF8" stroke="#B7BFAE"/>
  <text class="name" x="58" y="188">Desktop adapter</text>
  <text class="sub" x="172" y="188">Codex desktop Pet</text>

  <g>
    <rect x="58" y="202" width="62" height="24" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
    <text class="tag" x="89" y="218" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
    <text class="step" x="132" y="218.5"><tspan class="cmd">validateArt</tspan>  v2 atlas, 8 × 11 cells</text>

    <rect x="58" y="242" width="62" height="24" rx="4" fill="#FFF1CC" stroke="#D99A1E"/>
    <text class="tag" x="89" y="258" text-anchor="middle" fill="#8A5A00">TO TEST</text>
    <text class="step" x="132" y="258.5"><tspan class="cmd">findAvatar</tspan>  local custom: ID ↔ cloud pet_ ID</text>

    <rect x="58" y="282" width="62" height="24" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
    <text class="tag" x="89" y="298" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
    <text class="step" x="132" y="298.5"><tspan class="cmd">setAppearance</tspan>  write local atlas and manifest</text>

    <rect x="58" y="322" width="62" height="24" rx="4" fill="#FFF1CC" stroke="#D99A1E"/>
    <text class="tag" x="89" y="338" text-anchor="middle" fill="#8A5A00">TO TEST</text>
    <text class="step" x="132" y="338.5"><tspan class="cmd">setAppearance</tspan>  replace the cloud Pet's image</text>

    <rect x="58" y="362" width="62" height="24" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
    <text class="tag" x="89" y="378" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
    <text class="step" x="132" y="378.5"><tspan class="cmd">setAppearance</tspan>  IPC refresh for that Avatar</text>

    <rect x="58" y="402" width="62" height="24" rx="4" fill="#FFF1CC" stroke="#D99A1E"/>
    <text class="tag" x="89" y="418" text-anchor="middle" fill="#8A5A00">TO TEST</text>
    <text class="step" x="132" y="418.5"><tspan class="cmd">setAppearance</tspan>  read back the saved image</text>

    <rect x="58" y="442" width="62" height="24" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
    <text class="tag" x="89" y="458" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
    <text class="step" x="132" y="458.5"><tspan class="cmd">diagnose</tspan>  record, Avatar ID, list, mapping, selection</text>
  </g>

  <!-- dots adapter -->
  <rect x="530" y="162" width="430" height="330" rx="10" fill="#FAFBF8" stroke="#B7BFAE"/>
  <text class="name" x="548" y="188">Dots adapter</text>
  <text class="sub" x="640" y="188">Dots Avatar</text>

  <g>
    <rect x="548" y="202" width="62" height="24" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
    <text class="tag" x="579" y="218" text-anchor="middle" fill="#2F4F8A">AGENT</text>
    <text class="step" x="622" y="218.5"><tspan class="cmd">validateArt</tspan>  format defined by Dots tools</text>

    <rect x="548" y="242" width="62" height="24" rx="4" fill="#FBF3E4" stroke="#D8B978"/>
    <text class="tag" x="579" y="258" text-anchor="middle" fill="#7A5A12">RUNTIME</text>
    <text class="step" x="622" y="258.5"><tspan class="cmd">findAvatar</tspan>  the saved Avatar ID</text>

    <rect x="548" y="282" width="62" height="24" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
    <text class="tag" x="579" y="298" text-anchor="middle" fill="#2F4F8A">AGENT</text>
    <text class="step" x="622" y="298.5"><tspan class="cmd">setAppearance</tspan>  set that Avatar's image</text>

    <rect x="548" y="322" width="62" height="24" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
    <text class="tag" x="579" y="338" text-anchor="middle" fill="#2F4F8A">AGENT</text>
    <text class="step" x="622" y="338.5"><tspan class="cmd">setAppearance</tspan>  refresh if active, keep selection</text>

    <rect x="548" y="362" width="62" height="24" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
    <text class="tag" x="579" y="378" text-anchor="middle" fill="#2F4F8A">AGENT</text>
    <text class="step" x="622" y="378.5"><tspan class="cmd">setAppearance</tspan>  read back the saved image</text>

    <rect x="548" y="402" width="62" height="24" rx="4" fill="#EAF0FA" stroke="#9CB3DC"/>
    <text class="tag" x="579" y="418" text-anchor="middle" fill="#2F4F8A">AGENT</text>
    <text class="step" x="622" y="418.5"><tspan class="cmd">diagnose</tspan>  Avatar state through Dots tools</text>

    <text class="sub" x="548" y="454">The Agent reports its steps with</text>
    <text class="sub" x="548" y="470"><tspan class="cmd" fill="#1F2A1C">host-result</tspan>; the runtime checks the Avatar ID.</text>
  </g>

  <!-- appearance checks -->
  <text class="layer" x="40" y="528">FOUR APPEARANCE CHECKS</text>
  <text class="where" x="262" y="528">saved separately every time; passing one does not prove another</text>

  <path d="M40 546H250L268 590L250 634H40Z" fill="#F3F3F0" stroke="#B7BFAE"/>
  <circle cx="64" cy="572" r="11" fill="#5B6657"/><text class="num" x="64" y="576.3" text-anchor="middle">1</text>
  <text class="name" x="84" y="577">Files written</text>
  <text class="sub" x="56" y="602">the write or upload</text>
  <text class="sub" x="56" y="618">itself succeeded</text>

  <path d="M266 546H486L504 590L486 634H266L284 590Z" fill="#F3F8EA" stroke="#6E8A3C" stroke-width="1.8"/>
  <circle cx="306" cy="572" r="11" fill="#4E6B22"/><text class="num" x="306" y="576.3" text-anchor="middle">2</text>
  <text class="name" x="326" y="577">Saved image matches</text>
  <text class="sub" x="298" y="602">read back from the host, same</text>
  <text class="sub" x="298" y="618">as the accepted image</text>

  <path d="M502 546H712L730 590L712 634H502L520 590Z" fill="#F3F3F0" stroke="#B7BFAE"/>
  <circle cx="542" cy="572" r="11" fill="#5B6657"/><text class="num" x="542" y="576.3" text-anchor="middle">3</text>
  <text class="name" x="562" y="577">Refresh requested</text>
  <text class="sub" x="534" y="602">delivery of the request only,</text>
  <text class="sub" x="534" y="618">not what the screen shows</text>

  <path d="M728 546H960V634H728L746 590Z" fill="#F3F3F0" stroke="#B7BFAE"/>
  <circle cx="768" cy="572" r="11" fill="#5B6657"/><text class="num" x="768" y="576.3" text-anchor="middle">4</text>
  <text class="name" x="788" y="577">Display confirmed</text>
  <text class="sub" x="760" y="602">only when the host can show it;</text>
  <text class="sub" x="760" y="618">otherwise it stays unknown</text>

  <path class="flow" d="M385 664V638" marker-end="url(#a)" stroke="#4E6B22"/>
  <text class="sub" x="398" y="667" fill="#4E6B22"><tspan class="cmd" fill="#4E6B22">finish-story</tspan>: a story with a new appearance can finish once check 2 passes</text>
</svg>
