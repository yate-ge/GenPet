<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1046" role="img" aria-labelledby="t d">
  <title id="t">GenPet 架构：分层</title>
  <desc id="d">三层。宿主内部：对话框和定时任务启动 Agent；Agent 读取用户资料、用图像生成画图，并把新形象换到 Pet Avatar 上；提示词层里，主 skill 负责入口和主流程，需要时调用子 skill 模块：四个 Designer 角色和 ImageReviewer。参考文档不在流程里，主 skill 和子 skill 都会引用；运行时里，命令入口调用故事流程、日常功能和宿主适配；三者都通过核心读写记录，故事流程通过宿主适配换形象。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .grp { font-size: 12.5px; font-weight: 600; }
    .chip { font-size: 10px; fill: #3F4A3B; }
    .rel { font-size: 11px; fill: #3F4A3B; }
    .note { font-size: 11.5px; fill: #3F4A3B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .pill { font-size: 10px; font-weight: 600; fill: #8A5A00; }
    .flow { stroke: #4A5646; stroke-width: 1.6; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2.2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6E8A3C"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
  </defs>

  <rect width="1080" height="1046" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1079" height="1045" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- legend -->
  <rect x="716" y="17" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="744" y="29.5" text-anchor="middle">待开发</text>
  <text class="sub" x="780" y="30">框内有尚未实现的部分</text>

  <!-- HOST -->
  <rect x="30" y="50" width="1020" height="212" rx="10" fill="#EEF4E4" stroke="#9DB57A"/>
  <text class="layer" x="48" y="75">宿主</text>
  <text class="where" x="88" y="75">Codex 桌面端 · Dots</text>
  <text class="sub" x="1032" y="75" text-anchor="end">Agent 用宿主自带的工具使用这些能力，并回报实际结果</text>

  <rect x="48" y="104" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="138" y="128" text-anchor="middle">对话框</text>
  <text class="sub" x="138" y="147" text-anchor="middle">用户的命令和对话</text>

  <rect x="48" y="184" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="138" y="208" text-anchor="middle">定时任务</text>
  <text class="sub" x="138" y="227" text-anchor="middle">每 5 小时检查 · 主动事件</text>

  <rect x="330" y="104" width="180" height="136" rx="8" fill="#FFFFFF" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="420" y="162" text-anchor="middle">Agent</text>
  <text class="sub" x="420" y="182" text-anchor="middle">判断、写作、画图，</text>
  <text class="sub" x="420" y="197" text-anchor="middle">执行每一步</text>

  <path class="flow" d="M230 132H328" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="rel" x="279" y="125" text-anchor="middle">请求 · 故事</text>
  <path class="flow" d="M228 212H328" marker-end="url(#a)"/>
  <text class="rel" x="279" y="205" text-anchor="middle">触发检查</text>

  <rect x="600" y="104" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="685" y="128" text-anchor="middle">用户资料</text>
  <text class="sub" x="685" y="147" text-anchor="middle">宿主允许读到的内容</text>
  <rect x="706" y="95" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="734" y="107.5" text-anchor="middle">待开发</text>

  <rect x="600" y="184" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="685" y="208" text-anchor="middle">图像生成</text>
  <text class="sub" x="685" y="227" text-anchor="middle">内置生图、精灵图脚本</text>

  <path class="flow" d="M510 132H598" marker-end="url(#a)"/>
  <text class="rel" x="554" y="125" text-anchor="middle">读取</text>
  <path class="flow" d="M510 212H598" marker-end="url(#a)"/>
  <text class="rel" x="554" y="205" text-anchor="middle">画图</text>

  <rect x="862" y="104" width="170" height="136" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="947" y="150" text-anchor="middle">Pet Avatar</text>
  <text class="sub" x="947" y="171" text-anchor="middle">用户看到的宠物：</text>
  <text class="sub" x="947" y="187" text-anchor="middle">本地条目、云端 Pet、</text>
  <text class="sub" x="947" y="203" text-anchor="middle">Dots Avatar</text>
  <path class="flow" d="M510 172H860" marker-end="url(#a)"/>
  <text class="rel" x="816" y="165" text-anchor="middle">换形象</text>

  <g transform="translate(0,56)">
  <!-- host to prompt -->
  <path class="flow" d="M380 184V248" marker-end="url(#a)"/>
  <text class="note" x="368" y="232" text-anchor="end">读取主 skill、子 skill 和参考文档</text>

  <!-- PROMPT LAYER -->
  <rect x="30" y="250" width="790" height="394" rx="10" fill="#EAF0FA" stroke="#9CB3DC"/>
  <text class="layer" x="48" y="275">提示词层</text>
  <text class="where mono" x="114" y="275">framework/</text>
  <text class="sub" x="802" y="275" text-anchor="end">规定宠物是什么、故事怎么生成；具体内容保持开放</text>

  <rect x="48" y="290" width="542" height="78" rx="8" fill="#FFFFFF" stroke="#9CB3DC" stroke-width="1.4"/>
  <text class="name" x="66" y="313">主 skill</text>
  <text class="sub" x="66" y="334">入口：/genpet 和 6 个命令；判断请求是对话、故事还是诊断</text>
  <text class="sub" x="66" y="352">主流程：读记录 → 做决定 → 画图并检查 → 换形象 → 完成 → 讲给用户</text>
  <rect x="526" y="281" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="554" y="293.5" text-anchor="middle">待开发</text>

  <path class="flow" d="M420 368V392" marker-end="url(#a)"/>
  <text class="rel" x="432" y="385">需要时调用</text>

  <rect x="48" y="394" width="542" height="232" rx="8" fill="#FFFFFF"/>
  <rect x="48" y="394" width="542" height="28" rx="8" fill="#D6E2F6"/>
  <rect x="48" y="408" width="542" height="14" fill="#D6E2F6"/>
  <rect x="48" y="394" width="542" height="232" rx="8" fill="none" stroke="#9CB3DC"/>
  <text class="name" x="66" y="413">子 skill 模块</text>
  <text class="sub" x="578" y="413" text-anchor="end" fill="#3F4A3B">Agent 依次扮演，每个只决定一类事情</text>

  <rect x="58" y="432" width="257" height="62" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="grp" x="70" y="451">GeneDesigner</text>
  <text class="rel" x="303" y="451" text-anchor="end" fill="#5B6657">只在领养时</text>
  <text class="sub" x="70" y="469" fill="#1F2A1C">这只宠物是谁</text>
  <text class="sub" x="70" y="485">相遇、基因、性格</text>
  <rect x="323" y="432" width="257" height="62" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="grp" x="335" y="451">StoryDesigner</text>
  <text class="rel" x="568" y="451" text-anchor="end" fill="#5B6657">每次故事和对话</text>
  <text class="sub" x="335" y="469" fill="#1F2A1C">发生了什么、怎么讲</text>
  <text class="sub" x="335" y="485">故事、成长变化、送用户的东西、对话回复</text>
  <rect x="58" y="502" width="257" height="62" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="grp" x="70" y="521">PetDesigner</text>
  <text class="rel" x="303" y="521" text-anchor="end" fill="#5B6657">每次换形象</text>
  <text class="sub" x="70" y="539" fill="#1F2A1C">宠物长什么样</text>
  <text class="sub" x="70" y="555">蛋、各阶段、特殊形态</text>
  <rect x="323" y="502" width="257" height="62" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="grp" x="335" y="521">HomeDesigner</text>
  <text class="rel" x="568" y="521" text-anchor="end" fill="#5B6657">家有变化时</text>
  <text class="sub" x="335" y="539" fill="#1F2A1C">宠物的家</text>
  <text class="sub" x="335" y="555">布局、搬家、家的画面</text>

  <rect x="58" y="572" width="522" height="44" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="grp" x="70" y="590">ImageReviewer</text>
  <text class="rel" x="568" y="590" text-anchor="end" fill="#5B6657">每张图</text>
  <text class="sub" x="70" y="607" fill="#3F4A3B">实际画出的图是否合格：对照产品规则和要求检查；通过才验收，否则重画</text>

  <rect x="632" y="290" width="170" height="336" rx="8" fill="#FFFFFF" stroke="#9CB3DC" stroke-dasharray="6 4"/>
  <text class="name" x="717" y="316" text-anchor="middle">参考文档</text>
  <text class="sub" x="717" y="344" text-anchor="middle">主 skill 和子 skill</text>
  <text class="sub" x="717" y="360" text-anchor="middle">共用的知识</text>
  <path d="M650 386H784" stroke="#C5D3EA" stroke-width="1"/>
  <text class="sub" x="717" y="414" text-anchor="middle" fill="#1F2A1C">产品规则</text>
  <text class="sub" x="717" y="438" text-anchor="middle" fill="#1F2A1C">记录格式</text>
  <text class="sub" x="717" y="462" text-anchor="middle" fill="#1F2A1C">故事检查与定时</text>
  <text class="sub" x="717" y="486" text-anchor="middle" fill="#1F2A1C">命名</text>
  <text class="sub" x="717" y="510" text-anchor="middle" fill="#1F2A1C">桌面端和 Dots 的格式</text>

  <path class="flow" d="M632 329H592" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="rel" x="612" y="322" text-anchor="middle">引用</text>
  <path class="flow" d="M632 510H592" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="rel" x="612" y="503" text-anchor="middle">引用</text>

  <g transform="translate(0,242)">
  <!-- RUNTIME -->
  <rect x="30" y="428" width="790" height="294" rx="10" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="layer" x="48" y="453">运行时</text>
  <text class="where mono" x="100" y="453">src/</text>
  <text class="sub" x="802" y="453" text-anchor="end">负责记录、检查和换形象</text>

  <rect x="48" y="468" width="754" height="46" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="496">命令入口</text>
  <text class="sub" x="786" y="496" text-anchor="end">Agent 执行的每条命令都返回一个 JSON 结果</text>
  <path class="flow" d="M123 514V532" marker-end="url(#a)"/>
  <path class="flow" d="M398 514V532" marker-end="url(#a)"/>
  <path class="flow" d="M727 514V532" marker-end="url(#a)"/>

  <rect x="48" y="534" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="123" y="556" text-anchor="middle">日常功能</text>
  <text class="sub" x="123" y="576" text-anchor="middle">故事检查的周期</text>
  <text class="sub" x="123" y="591" text-anchor="middle">命名</text>
  <text class="sub" x="123" y="606" text-anchor="middle">对话摘要</text>
  <text class="sub" x="123" y="621" text-anchor="middle">状态摘要</text>

  <rect x="212" y="534" width="372" height="100" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="226" y="556">故事流程</text>
  <text class="rel" x="572" y="556" text-anchor="end" fill="#5B6657">一次只有一个未完成的故事</text>
  <rect x="262.0" y="564" width="32.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="278.0" y="578.6" text-anchor="middle">开始</text>
  <path class="flow" d="M295.0 575H302.0" marker-end="url(#s)" stroke-width="1.2"/>
  <rect x="304.0" y="564" width="52.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="330.0" y="578.6" text-anchor="middle">单元结果</text>
  <path class="flow" d="M357.0 575H364.0" marker-end="url(#s)" stroke-width="1.2"/>
  <rect x="366.0" y="564" width="32.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="382.0" y="578.6" text-anchor="middle">计划</text>
  <path class="flow" d="M399.0 575H406.0" marker-end="url(#s)" stroke-width="1.2"/>
  <rect x="408.0" y="564" width="32.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="424.0" y="578.6" text-anchor="middle">图片</text>
  <path class="flow" d="M441.0 575H448.0" marker-end="url(#s)" stroke-width="1.2"/>
  <rect x="450.0" y="564" width="42.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="471.0" y="578.6" text-anchor="middle">换形象</text>
  <path class="flow" d="M493.0 575H500.0" marker-end="url(#s)" stroke-width="1.2"/>
  <rect x="502.0" y="564" width="32.0" height="22" rx="11" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="chip" x="518.0" y="578.6" text-anchor="middle">完成</text>
  <text class="sub" x="398" y="606" text-anchor="middle">每一步都能安全重试；代码保证：</text>
  <text class="sub" x="398" y="621" text-anchor="middle" fill="#3F4A3B">身份不变 · 阶段只向前 · 到期必须成长</text>

  <rect x="652" y="534" width="150" height="100" rx="8" fill="#F3F8EA" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="727" y="556" text-anchor="middle">宿主适配</text>
  <text class="sub" x="727" y="576" text-anchor="middle">桌面端 · Dots</text>
  <text class="sub" x="727" y="591" text-anchor="middle">检查图片格式、</text>
  <text class="sub" x="727" y="606" text-anchor="middle">找到 Avatar、</text>
  <text class="sub" x="727" y="621" text-anchor="middle">换形象、诊断</text>
  <rect x="738" y="525" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="766" y="537.5" text-anchor="middle">待开发</text>
  <path class="flow" d="M584 584H650" marker-end="url(#a)"/>
  <text class="rel" x="617" y="577" text-anchor="middle">换形象</text>

  <path class="flow" d="M123 634V654" marker-end="url(#a)"/>
  <path class="flow" d="M398 634V654" marker-end="url(#a)"/>
  <path class="flow" d="M727 634V654" marker-end="url(#a)"/>
  <text class="rel" x="410" y="648">读写记录</text>

  <rect x="48" y="656" width="754" height="52" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="687">核心</text>
  <text class="sub" x="786" y="687" text-anchor="end">保存的数据格式；加锁、原子写入</text>

  <!-- host interface connector -->
  <path class="port" d="M802 584H880V-56" marker-end="url(#p)"/>
  <text class="name" x="894" y="392" fill="#4E6B22">宿主接口</text>
  <text class="sub" x="894" y="411">运行时自己做的步骤：</text>
  <text class="sub" x="894" y="426">文件、IPC、app-tools</text>
  <text class="sub" x="894" y="452">其余步骤交给 Agent，</text>
  <text class="sub" x="894" y="467">做完后用 host-result 回报</text>

  <g transform="translate(0,-16)">
  <!-- records -->
  <path class="flow" d="M802 698H848" marker-end="url(#a)"/>
  <path d="M850 672c0-9 45-14 100-14s100 5 100 14v52c0 9-45 14-100 14s-100-5-100-14z" fill="#FFFFFF" stroke="#8C8C84"/>
  <path d="M850 672c0 9 45 14 100 14s100-5 100-14" fill="none" stroke="#8C8C84"/>
  <text class="name" x="950" y="704" text-anchor="middle">记录</text>
  <text class="mono" x="950" y="722" text-anchor="middle" fill="#5B6657">~/.genpet/&lt;host&gt;/</text>
  </g>
  </g>
  </g>
  <!-- agent to runtime -->
  <path class="flow" d="M460 240V284H850V789H804" marker-end="url(#a)"/>
  <text class="note" x="472" y="278">运行 <tspan class="mono">node dist/cli.js &lt;command&gt;</tspan>，每次得到一个 JSON 结果</text>
</svg>
