<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 870" role="img" aria-labelledby="t d">
  <title id="t">GenPet 架构：分层</title>
  <desc id="d">四层。宿主提供 Agent 和它用到的能力；提示词层告诉 Agent 做什么；运行时保存身份和记录，并把新形象换到 Pet Avatar 上；构建与发布把源码变成可安装的插件包。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .note { font-size: 11.5px; fill: #3F4A3B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .pill { font-size: 10px; font-weight: 600; fill: #8A5A00; }
    .flow { stroke: #4A5646; stroke-width: 1.6; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2.2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6E8A3C"/>
    </marker>
  </defs>

  <rect width="1080" height="870" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1079" height="869" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- legend -->
  <rect x="716" y="17" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="744" y="29.5" text-anchor="middle">待开发</text>
  <text class="sub" x="780" y="30">框内有尚未实现的部分</text>

  <!-- HOST -->
  <rect x="30" y="50" width="1020" height="156" rx="10" fill="#EEF4E4" stroke="#9DB57A"/>
  <text class="layer" x="48" y="75">宿主</text>
  <text class="where" x="88" y="75">Codex 桌面端 · Dots</text>
  <text class="sub" x="1032" y="75" text-anchor="end">Agent 用宿主自带的工具使用这些能力，并回报实际结果</text>

  <rect x="48" y="104" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="138" y="138" text-anchor="middle">Agent</text>
  <text class="sub" x="138" y="158" text-anchor="middle">判断、写作、画图，</text>
  <text class="sub" x="138" y="173" text-anchor="middle">执行每一步</text>

  <rect x="264" y="104" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="354" y="138" text-anchor="middle">用户资料</text>
  <text class="sub" x="354" y="158" text-anchor="middle">这个宿主实际允许</text>
  <text class="sub" x="354" y="173" text-anchor="middle">Agent 读到的内容</text>
  <rect x="380" y="96" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="408" y="108.5" text-anchor="middle">待开发</text>

  <rect x="456" y="104" width="166" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="539" y="138" text-anchor="middle">图像生成</text>
  <text class="sub" x="539" y="158" text-anchor="middle">内置生图、</text>
  <text class="sub" x="539" y="173" text-anchor="middle">精灵图辅助脚本</text>

  <rect x="634" y="104" width="154" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="711" y="138" text-anchor="middle">定时任务</text>
  <text class="sub" x="711" y="158" text-anchor="middle">每 5 小时的故事检查、</text>
  <text class="sub" x="711" y="173" text-anchor="middle">主动事件</text>

  <rect x="800" y="104" width="232" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="916" y="138" text-anchor="middle">Pet Avatar</text>
  <text class="sub" x="916" y="158" text-anchor="middle">列表 · 选择 · 形象 · 刷新</text>
  <text class="sub" x="916" y="173" text-anchor="middle">本地条目、云端 Pet、Dots Avatar</text>

  <path class="flow" d="M228 146H262" marker-end="url(#a)"/>

  <!-- host to prompt -->
  <path class="flow" d="M138 188V248" marker-end="url(#a)"/>
  <text class="note" x="150" y="232">读取 skills、参考文档和提示词</text>

  <!-- PROMPT LAYER -->
  <rect x="30" y="250" width="790" height="128" rx="10" fill="#EAF0FA" stroke="#9CB3DC"/>
  <text class="layer" x="48" y="275">提示词层</text>
  <text class="where mono" x="114" y="275">framework/</text>
  <text class="sub" x="802" y="275" text-anchor="end">规定宠物是什么、故事怎么生成；具体内容保持开放</text>

  <rect x="48" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="136" y="319" text-anchor="middle">Skills</text>
  <text class="sub" x="136" y="340" text-anchor="middle">命令入口 · 请求类型</text>
  <rect x="160" y="282" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="188" y="294.5" text-anchor="middle">待开发</text>

  <rect x="240" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="328" y="319" text-anchor="middle">流程与参考文档</text>
  <text class="sub" x="328" y="340" text-anchor="middle">步骤顺序 · 宿主格式</text>

  <rect x="432" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="520" y="319" text-anchor="middle">meta.md</text>
  <text class="sub" x="520" y="340" text-anchor="middle">产品规则</text>

  <rect x="624" y="290" width="178" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="713" y="319" text-anchor="middle">生成单元</text>
  <text class="sub" x="713" y="340" text-anchor="middle">12 个提示词 + units.json</text>

  <!-- prompt to runtime -->
  <path class="flow" d="M138 378V426" marker-end="url(#a)"/>
  <text class="note" x="150" y="407">Agent 运行 <tspan class="mono">node dist/cli.js &lt;command&gt;</tspan>，每次得到一个 JSON 结果</text>

  <!-- RUNTIME -->
  <rect x="30" y="428" width="790" height="308" rx="10" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="layer" x="48" y="453">运行时</text>
  <text class="where mono" x="100" y="453">src/</text>
  <text class="sub" x="802" y="453" text-anchor="end">不做创作判断 · 只允许向下引用</text>

  <rect x="48" y="468" width="754" height="46" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="496">cli</text>
  <text class="sub" x="100" y="496">命令表：共用命令，加上当前宿主自己的命令</text>

  <rect x="48" y="526" width="369" height="70" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="555">故事</text>
  <text class="sub" x="66" y="576">lifecycle · growth · art · generation</text>

  <rect x="433" y="526" width="369" height="70" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="451" y="555">日常功能</text>
  <text class="sub" x="451" y="576">schedule · naming · chat · status</text>

  <rect x="48" y="608" width="754" height="52" rx="8" fill="#F3F8EA" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="66" y="631">宿主适配</text>
  <text class="sub" x="136" y="631">desktop · dots</text>
  <text class="sub" x="66" y="649">实现宿主接口：validateArt · findAvatar · setAppearance · diagnose</text>
  <rect x="738" y="600" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="766" y="612.5" text-anchor="middle">待开发</text>

  <rect x="48" y="672" width="754" height="52" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="695">核心</text>
  <text class="sub" x="106" y="695">model · store · pending</text>
  <text class="sub" x="66" y="713">保存的数据类型、加锁写入、唯一的未完成故事；不依赖任何宿主</text>
  <rect x="738" y="664" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="766" y="676.5" text-anchor="middle">待开发</text>

  <!-- host interface connector -->
  <path class="port" d="M802 634H880V190" marker-end="url(#p)"/>
  <text class="name" x="894" y="392" fill="#4E6B22">宿主接口</text>
  <text class="sub" x="894" y="411">运行时自己做的步骤：</text>
  <text class="sub" x="894" y="426">文件、IPC、app-tools</text>
  <text class="sub" x="894" y="452">运行时做不了的步骤</text>
  <text class="sub" x="894" y="467">交给 Agent，做完后</text>
  <text class="sub" x="894" y="482">用 host-result 回报</text>

  <!-- records -->
  <path class="flow" d="M802 698H848" marker-end="url(#a)"/>
  <path d="M850 672c0-9 45-14 100-14s100 5 100 14v52c0 9-45 14-100 14s-100-5-100-14z" fill="#FFFFFF" stroke="#8C8C84"/>
  <path d="M850 672c0 9 45 14 100 14s100-5 100-14" fill="none" stroke="#8C8C84"/>
  <text class="name" x="950" y="704" text-anchor="middle">记录</text>
  <text class="mono" x="950" y="722" text-anchor="middle" fill="#5B6657">~/.genpet/&lt;host&gt;/</text>

  <!-- BUILD & RELEASE -->
  <rect x="30" y="776" width="1020" height="66" rx="10" fill="#F3F3F0" stroke="#C4C4BC"/>
  <text class="layer" x="48" y="813">构建与发布</text>

  <rect x="196" y="791" width="134" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="263" y="813" text-anchor="middle">framework/ + src/</text>
  <path class="flow" d="M330 809H352" marker-end="url(#a)"/>
  <rect x="354" y="791" width="110" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="409" y="813" text-anchor="middle">build:plugin</text>
  <path class="flow" d="M464 809H486" marker-end="url(#a)"/>
  <rect x="488" y="791" width="236" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="606" y="813" text-anchor="middle">plugins/genpet · genpet-dots</text>
  <path class="flow" d="M724 809H746" marker-end="url(#a)"/>
  <rect x="748" y="791" width="118" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="sub" x="807" y="813" text-anchor="middle" fill="#1F2A1C">marketplace</text>
  <path class="flow" d="M866 809H888" marker-end="url(#a)"/>
  <rect x="890" y="791" width="142" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="sub" x="961" y="813" text-anchor="middle" fill="#1F2A1C">安装到宿主</text>
</svg>
