<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1046" role="img" aria-labelledby="t d">
  <title id="t">GenPet architecture: layers</title>
  <desc id="d">Three layers. Inside the host, chat and the scheduler start the Agent; the Agent reads user information, draws with image generation and puts new appearances on the Pet Avatar. In the prompt layer, the main skill handles the entries (/genpet takes any request) and the main workflow and calls sub skills when needed: four Designer roles and the ImageReviewer. References sit beside the flow and both the main skill and the sub skills refer to them. In the runtime, commands call the story flow, everyday features and host adapters; all three read and write records through the core, and the story flow sets appearances through the host adapters. Everyday features include recent content and a random tool; records have one folder per pet.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .grp { font-size: 12.5px; font-weight: 600; }
    .chip { font-size: 10px; fill: #3F4A3B; }
    .rel { font-size: 11px; fill: #3F4A3B; }
    .note { font-size: 11.5px; fill: #3F4A3B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .pill { font-size: 10px; font-weight: 600; fill: #8A5A00; }
    .flow { stroke: #4A5646; stroke-width: 1.6; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2.2; fill: none; }
  </style>
