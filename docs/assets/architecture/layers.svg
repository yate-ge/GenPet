<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 870" role="img" aria-labelledby="t d">
  <title id="t">GenPet architecture: layers</title>
  <desc id="d">Four layers. The host provides the Agent and what it uses. The prompt layer tells the Agent what to do. The runtime keeps identity and saved records, and puts new appearances on the Pet Avatar. Build and release turns the sources into installable plugin packages.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .note { font-size: 11.5px; fill: #3F4A3B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .pill { font-size: 10px; font-weight: 600; fill: #8A5A00; }
    .flow { stroke: #4A5646; stroke-width: 1.6; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2.2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6E8A3C"/>
    </marker>
  </defs>

  <rect width="1080" height="870" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1079" height="869" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- legend -->
  <rect x="716" y="17" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="744" y="29.5" text-anchor="middle">planned</text>
  <text class="sub" x="780" y="30">part of this box is not implemented yet</text>

  <!-- HOST -->
  <rect x="30" y="50" width="1020" height="156" rx="10" fill="#EEF4E4" stroke="#9DB57A"/>
  <text class="layer" x="48" y="75">HOST</text>
  <text class="where" x="100" y="75">Codex desktop · Dots</text>
  <text class="sub" x="1032" y="75" text-anchor="end">the Agent uses these with the host's own tools and reports what happened</text>

  <rect x="48" y="104" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="138" y="138" text-anchor="middle">Agent</text>
  <text class="sub" x="138" y="158" text-anchor="middle">decides, writes, draws,</text>
  <text class="sub" x="138" y="173" text-anchor="middle">runs every step</text>

  <rect x="264" y="104" width="180" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="354" y="138" text-anchor="middle">User information</text>
  <text class="sub" x="354" y="158" text-anchor="middle">what this host really</text>
  <text class="sub" x="354" y="173" text-anchor="middle">lets the Agent read</text>
  <rect x="380" y="96" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="408" y="108.5" text-anchor="middle">planned</text>

  <rect x="456" y="104" width="166" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="539" y="138" text-anchor="middle">Image generation</text>
  <text class="sub" x="539" y="158" text-anchor="middle">built-in imagegen,</text>
  <text class="sub" x="539" y="173" text-anchor="middle">sprite helpers</text>

  <rect x="634" y="104" width="154" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="711" y="138" text-anchor="middle">Scheduler</text>
  <text class="sub" x="711" y="158" text-anchor="middle">5-hour story check,</text>
  <text class="sub" x="711" y="173" text-anchor="middle">proactive events</text>

  <rect x="800" y="104" width="232" height="84" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="916" y="138" text-anchor="middle">Pet Avatar</text>
  <text class="sub" x="916" y="158" text-anchor="middle">list · select · appearance · refresh</text>
  <text class="sub" x="916" y="173" text-anchor="middle">local entry, cloud Pet, Dots Avatar</text>

  <path class="flow" d="M228 146H262" marker-end="url(#a)"/>

  <!-- host to prompt -->
  <path class="flow" d="M138 188V248" marker-end="url(#a)"/>
  <text class="note" x="150" y="232">reads skills, references and prompts</text>

  <!-- PROMPT LAYER -->
  <rect x="30" y="250" width="790" height="128" rx="10" fill="#EAF0FA" stroke="#9CB3DC"/>
  <text class="layer" x="48" y="275">PROMPT LAYER</text>
  <text class="where mono" x="160" y="275">framework/</text>
  <text class="sub" x="802" y="275" text-anchor="end">what a pet is and how a story is made; all content stays open</text>

  <rect x="48" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="136" y="319" text-anchor="middle">Skills</text>
  <text class="sub" x="136" y="340" text-anchor="middle">commands · request types</text>
  <rect x="160" y="282" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="188" y="294.5" text-anchor="middle">planned</text>

  <rect x="240" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="328" y="319" text-anchor="middle">Workflow &amp; references</text>
  <text class="sub" x="328" y="340" text-anchor="middle">step order · host formats</text>

  <rect x="432" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="520" y="319" text-anchor="middle">meta.md</text>
  <text class="sub" x="520" y="340" text-anchor="middle">the product rules</text>

  <rect x="624" y="290" width="178" height="70" rx="8" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="name" x="713" y="319" text-anchor="middle">Generation units</text>
  <text class="sub" x="713" y="340" text-anchor="middle">12 prompts + units.json</text>

  <!-- prompt to runtime -->
  <path class="flow" d="M138 378V426" marker-end="url(#a)"/>
  <text class="note" x="150" y="407">the Agent runs <tspan class="mono">node dist/cli.js &lt;command&gt;</tspan> and gets one JSON result</text>

  <!-- RUNTIME -->
  <rect x="30" y="428" width="790" height="308" rx="10" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="layer" x="48" y="453">RUNTIME</text>
  <text class="where mono" x="122" y="453">src/</text>
  <text class="sub" x="802" y="453" text-anchor="end">makes no creative decisions · imports go downward only</text>

  <rect x="48" y="468" width="754" height="46" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="496">cli</text>
  <text class="sub" x="100" y="496">command table: shared commands plus the package host's own</text>

  <rect x="48" y="526" width="369" height="70" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="555">Story</text>
  <text class="sub" x="66" y="576">lifecycle · growth · art · generation</text>

  <rect x="433" y="526" width="369" height="70" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="451" y="555">Everyday features</text>
  <text class="sub" x="451" y="576">schedule · naming · chat · status</text>

  <rect x="48" y="608" width="754" height="52" rx="8" fill="#F3F8EA" stroke="#6E8A3C" stroke-width="1.6"/>
  <text class="name" x="66" y="631">Host adapters</text>
  <text class="sub" x="176" y="631">desktop · dots</text>
  <text class="sub" x="66" y="649">implement the host interface: validateArt · findAvatar · setAppearance · diagnose</text>
  <rect x="738" y="600" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="766" y="612.5" text-anchor="middle">planned</text>

  <rect x="48" y="672" width="754" height="52" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="66" y="695">Core</text>
  <text class="sub" x="112" y="695">model · store · pending</text>
  <text class="sub" x="66" y="713">saved data types, locked writes, the one unfinished story; depends on no host</text>
  <rect x="738" y="664" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="766" y="676.5" text-anchor="middle">planned</text>

  <!-- host interface connector -->
  <path class="port" d="M802 634H880V190" marker-end="url(#p)"/>
  <text class="name" x="894" y="392" fill="#4E6B22">Host interface</text>
  <text class="sub" x="894" y="411">steps the runtime does:</text>
  <text class="sub" x="894" y="426">files, IPC, app-tools</text>
  <text class="sub" x="894" y="452">Steps it cannot do go to</text>
  <text class="sub" x="894" y="467">the Agent, who reports</text>
  <text class="sub" x="894" y="482">back with host-result</text>

  <!-- records -->
  <path class="flow" d="M802 698H848" marker-end="url(#a)"/>
  <path d="M850 672c0-9 45-14 100-14s100 5 100 14v52c0 9-45 14-100 14s-100-5-100-14z" fill="#FFFFFF" stroke="#8C8C84"/>
  <path d="M850 672c0 9 45 14 100 14s100-5 100-14" fill="none" stroke="#8C8C84"/>
  <text class="name" x="950" y="704" text-anchor="middle">Records</text>
  <text class="mono" x="950" y="722" text-anchor="middle" fill="#5B6657">~/.genpet/&lt;host&gt;/</text>

  <!-- BUILD & RELEASE -->
  <rect x="30" y="776" width="1020" height="66" rx="10" fill="#F3F3F0" stroke="#C4C4BC"/>
  <text class="layer" x="48" y="813">BUILD &amp; RELEASE</text>

  <rect x="196" y="791" width="134" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="263" y="813" text-anchor="middle">framework/ + src/</text>
  <path class="flow" d="M330 809H352" marker-end="url(#a)"/>
  <rect x="354" y="791" width="110" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="409" y="813" text-anchor="middle">build:plugin</text>
  <path class="flow" d="M464 809H486" marker-end="url(#a)"/>
  <rect x="488" y="791" width="236" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="mono" x="606" y="813" text-anchor="middle">plugins/genpet · genpet-dots</text>
  <path class="flow" d="M724 809H746" marker-end="url(#a)"/>
  <rect x="748" y="791" width="118" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="sub" x="807" y="813" text-anchor="middle" fill="#1F2A1C">marketplace</text>
  <path class="flow" d="M866 809H888" marker-end="url(#a)"/>
  <rect x="890" y="791" width="142" height="36" rx="7" fill="#FFFFFF" stroke="#C4C4BC"/>
  <text class="sub" x="961" y="813" text-anchor="middle" fill="#1F2A1C">installed in the host</text>
</svg>
