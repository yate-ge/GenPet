<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="t d">
  <title id="t">GenPet architecture: one story, end to end</title>
  <desc id="d">Eight numbered steps in three lanes. The Agent runs every step in the middle lane, uses what the host provides on the left and saves every step through the runtime CLI on the right.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 13.5px; font-weight: 600; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .pill { font-size: 10px; font-weight: 600; fill: #8A5A00; }
    .flow { stroke: #4A5646; stroke-width: 1.5; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2; fill: none; }
    .row { stroke: #E4E7DE; stroke-width: 1; stroke-dasharray: 3 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6E8A3C"/>
    </marker>
  </defs>

  <rect width="1000" height="850" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="849" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- lanes -->
  <rect x="30" y="48" width="300" height="780" rx="10" fill="#EEF4E4" stroke="#9DB57A"/>
  <rect x="350" y="48" width="300" height="780" rx="10" fill="#F6F8F3" stroke="#6E8A3C" stroke-width="1.4"/>
  <rect x="670" y="48" width="300" height="780" rx="10" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="layer" x="50" y="75">HOST</text>
  <text class="where" x="100" y="75">what the host provides</text>
  <text class="layer" x="370" y="75">AGENT</text>
  <text class="where" x="428" y="75">runs steps 1 to 8</text>
  <text class="layer" x="690" y="75">RUNTIME</text>
  <text class="where" x="764" y="75">CLI commands</text>

  <!-- legend -->
  <rect x="716" y="17" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="744" y="29.5" text-anchor="middle">planned</text>
  <text class="sub" x="780" y="30">not implemented yet</text>

  <!-- 1 -->
  <rect x="50" y="96" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="180" y="121" text-anchor="middle">Trigger</text>
  <text class="sub" x="180" y="140" text-anchor="middle">schedule · Dots proactive · user command</text>
  <rect x="370" y="96" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="121" text-anchor="middle">Start or resume</text>
  <text class="sub" x="500" y="140" text-anchor="middle">reads status, reuses the trigger ID</text>
  <rect x="690" y="96" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="121" text-anchor="middle">begin-story</text>
  <text class="sub" x="820" y="140" text-anchor="middle">one unfinished story; returns growth, time</text>
  <path class="flow" d="M310 126H368" marker-end="url(#a)"/>
  <path class="flow" d="M630 126H688" marker-end="url(#a)"/>
  <circle cx="370" cy="96" r="11" fill="#4E6B22"/><text class="num" x="370" y="100.3" text-anchor="middle">1</text>

  <!-- 2 -->
  <rect x="50" y="180" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="180" y="205" text-anchor="middle">User information</text>
  <text class="sub" x="180" y="224" text-anchor="middle">what this host lets the Agent read</text>
  <rect x="370" y="180" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="205" text-anchor="middle">Read user information</text>
  <text class="sub" x="500" y="224" text-anchor="middle">real sources, each with its origin</text>
  <rect x="566" y="172" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="594" y="184.5" text-anchor="middle">planned</text>
  <path class="flow" d="M368 210H312" marker-end="url(#a)"/>
  <circle cx="370" cy="180" r="11" fill="#4E6B22"/><text class="num" x="370" y="184.3" text-anchor="middle">2</text>

  <!-- 3 -->
  <rect x="370" y="264" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="284" text-anchor="middle">Generation units</text>
  <text class="sub" x="500" y="301" text-anchor="middle">context → story → evolution →</text>
  <text class="sub" x="500" y="316" text-anchor="middle">appearance · home · carrier</text>
  <rect x="690" y="264" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="289" text-anchor="middle">record-step</text>
  <text class="sub" x="820" y="308" text-anchor="middle">saves each unit result</text>
  <path class="flow" d="M630 294H688" marker-end="url(#a)"/>
  <circle cx="370" cy="264" r="11" fill="#4E6B22"/><text class="num" x="370" y="268.3" text-anchor="middle">3</text>

  <!-- 4 -->
  <rect x="370" y="348" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="373" text-anchor="middle">Assemble the plan</text>
  <text class="sub" x="500" y="392" text-anchor="middle">story first, then state and appearance</text>
  <rect x="690" y="348" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="373" text-anchor="middle">plan-story</text>
  <text class="sub" x="820" y="392" text-anchor="middle">checks and saves the plan</text>
  <path class="flow" d="M630 378H688" marker-end="url(#a)"/>
  <circle cx="370" cy="348" r="11" fill="#4E6B22"/><text class="num" x="370" y="352.3" text-anchor="middle">4</text>

  <!-- 5 -->
  <rect x="50" y="432" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="180" y="457" text-anchor="middle">Image generation</text>
  <text class="sub" x="180" y="476" text-anchor="middle">built-in imagegen, sprite helpers</text>
  <rect x="370" y="432" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="457" text-anchor="middle">Draw and review</text>
  <text class="sub" x="500" y="476" text-anchor="middle">image-review on the actual file</text>
  <rect x="690" y="432" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="457" text-anchor="middle">accept-art</text>
  <text class="sub" x="820" y="476" text-anchor="middle">format checks, copy into assets</text>
  <path class="flow" d="M368 462H312" marker-end="url(#a)"/>
  <path class="flow" d="M630 462H688" marker-end="url(#a)"/>
  <circle cx="370" cy="432" r="11" fill="#4E6B22"/><text class="num" x="370" y="436.3" text-anchor="middle">5</text>

  <!-- 6: host update -->
  <rect x="40" y="508" width="920" height="146" rx="10" fill="#6E8A3C" fill-opacity="0.08" stroke="#6E8A3C" stroke-dasharray="5 4"/>
  <text class="layer" x="500" y="528" text-anchor="middle" fill="#4E6B22">HOST INTERFACE</text>

  <rect x="50" y="538" width="260" height="104" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="180" y="574" text-anchor="middle">Pet Avatar</text>
  <text class="sub" x="180" y="594" text-anchor="middle">local entry · cloud Pet · Dots Avatar</text>
  <text class="sub" x="180" y="610" text-anchor="middle">looked up by ID every time</text>

  <rect x="690" y="538" width="260" height="104" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="566" text-anchor="middle">set-appearance → host-result</text>
  <text class="sub" x="820" y="587" text-anchor="middle">does what the runtime can,</text>
  <text class="sub" x="820" y="602" text-anchor="middle">leaves the rest to the Agent,</text>
  <text class="sub" x="820" y="617" text-anchor="middle">saves what the host did</text>
  <rect x="886" y="530" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="914" y="542.5" text-anchor="middle">planned</text>

  <path class="port" d="M688 556H312" marker-end="url(#p)"/>
  <text class="sub" x="500" y="549" text-anchor="middle" fill="#4E6B22">done by the runtime: files · IPC · app-tools</text>

  <rect x="370" y="574" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="599" text-anchor="middle">Steps done by the Agent</text>
  <text class="sub" x="500" y="618" text-anchor="middle">the host's own tools, then report</text>
  <path class="port" d="M688 604H632" marker-start="url(#p)" marker-end="url(#p)"/>
  <path class="port" d="M368 604H312" marker-end="url(#p)"/>
  <circle cx="370" cy="574" r="11" fill="#4E6B22"/><text class="num" x="370" y="578.3" text-anchor="middle">6</text>

  <!-- 7 -->
  <rect x="370" y="670" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="695" text-anchor="middle">Complete the story</text>
  <text class="sub" x="500" y="714" text-anchor="middle">the pet's record changes only here</text>
  <rect x="690" y="670" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="690" text-anchor="middle">finish-story</text>
  <text class="sub" x="820" y="707" text-anchor="middle">needs: saved image matches;</text>
  <text class="sub" x="820" y="722" text-anchor="middle">saves stage, state, history together</text>
  <rect x="886" y="662" width="56" height="18" rx="9" fill="#FFF1CC" stroke="#D99A1E"/>
  <text class="pill" x="914" y="674.5" text-anchor="middle">planned</text>
  <path class="flow" d="M630 700H688" marker-end="url(#a)"/>
  <circle cx="370" cy="670" r="11" fill="#4E6B22"/><text class="num" x="370" y="674.3" text-anchor="middle">7</text>

  <!-- 8 -->
  <rect x="50" y="754" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="180" y="779" text-anchor="middle">Chat</text>
  <text class="sub" x="180" y="798" text-anchor="middle">story text and media, pet's world only</text>
  <rect x="370" y="754" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="500" y="779" text-anchor="middle">Output unit</text>
  <text class="sub" x="500" y="798" text-anchor="middle">shows only what actually finished</text>
  <rect x="690" y="754" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="820" y="779" text-anchor="middle">story-output</text>
  <text class="sub" x="820" y="798" text-anchor="middle">the finished story and its saved media</text>
  <path class="flow" d="M368 784H312" marker-end="url(#a)"/>
  <path class="flow" d="M688 784H632" marker-end="url(#a)"/>
  <circle cx="370" cy="754" r="11" fill="#4E6B22"/><text class="num" x="370" y="758.3" text-anchor="middle">8</text>
</svg>
