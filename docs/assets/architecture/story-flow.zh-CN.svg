<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 992" role="img" aria-labelledby="t d">
  <title id="t">GenPet 架构：一次故事的完整流程</title>
  <desc id="d">八个步骤。宿主里，中间一列是 Agent 按主 skill 的主流程执行，左边是它用到的宿主能力；每一步标出由主 skill 还是哪个子 skill 负责。第 5 步由几个执行者分工并行画图，图像协调子代理收集汇总，ImageReviewer 检查。第 7 步之后，形象、名字和简介跟着同一个 cloud ID 云端同步。右边是运行时的命令，保存每一步；领养时随机工具给出种子，从 Agent 列的设计候选里选一个。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1F2A1C; }
    .layer { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .where { font-size: 12px; fill: #5B6657; }
    .name { font-size: 13.5px; font-weight: 600; }
    .role { font-size: 11px; font-weight: 600; }
    .when { font-size: 10px; fill: #5B6657; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #5B6657; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .pill { font-size: 10px; font-weight: 600; }
    .flow { stroke: #4A5646; stroke-width: 1.5; fill: none; }
    .port { stroke: #6E8A3C; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4A5646"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6E8A3C"/>
    </marker>
  </defs>

  <rect width="1000" height="992" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="991" rx="14" fill="none" stroke="#E2E6DA"/>

  <!-- legend -->
  <rect x="24" y="17" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="49.5" y="29.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <rect x="81" y="17" width="51" height="18" rx="9" fill="#D6E2F6" stroke="#9CB3DC"/>
  <text class="pill" x="106.5" y="29.5" text-anchor="middle" fill="#2F4A7A">子 skill</text>
  <text class="sub" x="140" y="30">这一步由谁负责</text>
  <rect x="246.5" y="17" width="58" height="18" rx="9" fill="#F3F3F0" stroke="#B7BFAE"/>
  <text class="pill" x="275.5" y="29.5" text-anchor="middle" fill="#4A5646">换形象时</text>
  <text class="sub" x="312.5" y="30">什么时候有这一步</text>

  <!-- host: capabilities and the Agent -->
  <rect x="20" y="46" width="628" height="926" rx="10" fill="#EEF4E4" stroke="#9DB57A"/>
  <text class="layer" x="36" y="71">宿主</text>
  <text class="where" x="81" y="71">默认 Codex 桌面端 · 可切换到 Dots</text>
  <text class="where" x="36" y="109">Agent 用到的能力</text>
  <rect x="300" y="84" width="332" height="876" rx="10" fill="#F6F8F3" stroke="#6E8A3C" stroke-width="1.4"/>
  <text class="layer" x="330" y="109">AGENT</text>
  <text class="where" x="389.4" y="109">按主 skill 的主流程执行</text>

  <!-- runtime -->
  <rect x="668" y="46" width="312" height="926" rx="10" fill="#FBF3E4" stroke="#D8B978"/>
  <text class="layer" x="684" y="71">运行时</text>
  <text class="where" x="740.5" y="71">CLI 命令</text>

  <!-- 1 -->
  <rect x="36" y="130" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="155" text-anchor="middle">触发</text>
  <text class="sub" x="156" y="174" text-anchor="middle">定时检查 · 用户命令</text>
  <rect x="316" y="130" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="157" text-anchor="middle">读记录</text>
  <text class="sub" x="466" y="175" text-anchor="middle">找到选中的这只宠物，开始或继续故事</text>
  <rect x="334" y="121" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="133.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <circle cx="316" cy="130" r="11" fill="#4E6B22"/><text class="num" x="316" y="134.3" text-anchor="middle">1</text>
  <rect x="684" y="130" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="155" text-anchor="middle">begin-story</text>
  <text class="sub" x="824" y="174" text-anchor="middle">一次只有一个未完成的故事</text>
  <path class="flow" d="M276 160H314" marker-end="url(#a)"/>
  <path class="flow" d="M616 160H682" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="36" y="214" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="239" text-anchor="middle">用户资料</text>
  <text class="sub" x="156" y="258" text-anchor="middle">Codex 的用户记忆等可读到的内容</text>
  <rect x="316" y="214" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="241" text-anchor="middle">读取用户资料</text>
  <text class="sub" x="466" y="259" text-anchor="middle">含对话里留下的话；记下每条资料的出处</text>
  <rect x="334" y="205" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="217.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <circle cx="316" cy="214" r="11" fill="#4E6B22"/><text class="num" x="316" y="218.3" text-anchor="middle">2</text>
  <path class="flow" d="M314 244H278" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="316" y="298" width="300" height="116" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="325" text-anchor="middle">做决定</text>
  <rect x="334" y="289" width="51" height="18" rx="9" fill="#D6E2F6" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="301.5" text-anchor="middle" fill="#2F4A7A">子 skill</text>
  <circle cx="316" cy="298" r="11" fill="#4E6B22"/><text class="num" x="316" y="302.3" text-anchor="middle">3</text>
  <rect x="328" y="336" width="134" height="32" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="338" y="349.5">GeneDesigner</text>
  <text class="when" x="338" y="362">领养时 · 旅程最多 5 轮</text>
  <rect x="470" y="336" width="134" height="32" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="480" y="349.5">StoryDesigner</text>
  <text class="when" x="480" y="362">每次故事</text>
  <rect x="328" y="374" width="134" height="32" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="338" y="387.5">PetDesigner</text>
  <text class="when" x="338" y="400">换形象时</text>
  <rect x="470" y="374" width="134" height="32" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="480" y="387.5">HomeDesigner</text>
  <text class="when" x="480" y="400">家有变化时</text>
  <rect x="684" y="298" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="name" x="824" y="320" text-anchor="middle">随机工具</text>
  <text class="sub" x="824" y="338" text-anchor="middle">领养时用种子选一个设计</text>
  <path class="flow" d="M618 324H682" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="684" y="362" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="384" text-anchor="middle">record-step</text>
  <text class="sub" x="824" y="402" text-anchor="middle">保存每个结果</text>
  <path class="flow" d="M616 388H682" marker-end="url(#a)"/>

  <!-- 4 -->
  <rect x="316" y="438" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="465" text-anchor="middle">组装故事计划</text>
  <text class="sub" x="466" y="483" text-anchor="middle">先有故事，再定状态和形象</text>
  <rect x="334" y="429" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="441.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <circle cx="316" cy="438" r="11" fill="#4E6B22"/><text class="num" x="316" y="442.3" text-anchor="middle">4</text>
  <rect x="684" y="438" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="463" text-anchor="middle">plan-story</text>
  <text class="sub" x="824" y="482" text-anchor="middle">检查并保存计划</text>
  <path class="flow" d="M616 468H682" marker-end="url(#a)"/>

  <!-- 5 -->
  <rect x="36" y="522" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="547" text-anchor="middle">图像生成</text>
  <text class="sub" x="156" y="566" text-anchor="middle">内置生图、精灵图辅助脚本</text>
  <rect x="316" y="522" width="300" height="104" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="549" text-anchor="middle">画图并检查</text>
  <rect x="328" y="560" width="72" height="36" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="364" y="575" text-anchor="middle">执行者</text>
  <text class="when" x="364" y="589" text-anchor="middle">分工并行出图</text>
  <rect x="414" y="560" width="80" height="36" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="454" y="575" text-anchor="middle">协调子代理</text>
  <text class="when" x="454" y="589" text-anchor="middle">收集、汇总</text>
  <rect x="508" y="560" width="96" height="36" rx="6" fill="#F4F7FC" stroke="#C5D3EA"/>
  <text class="role" x="556" y="575" text-anchor="middle">ImageReviewer</text>
  <text class="when" x="556" y="589" text-anchor="middle">检查实际的图</text>
  <path class="flow" d="M401 578H412" marker-end="url(#a)"/>
  <path class="flow" d="M495 578H506" marker-end="url(#a)"/>
  <text class="sub" x="466" y="614" text-anchor="middle">画过的状态直接复用</text>
  <rect x="334" y="513" width="150" height="18" rx="9" fill="#D6E2F6" stroke="#9CB3DC"/>
  <text class="pill" x="409" y="525.5" text-anchor="middle" fill="#2F4A7A">PetDesigner · ImageReviewer</text>
  <rect x="558" y="513" width="48" height="18" rx="9" fill="#F3F3F0" stroke="#B7BFAE"/>
  <text class="pill" x="582" y="525.5" text-anchor="middle" fill="#4A5646">要画新图时</text>
  <circle cx="316" cy="522" r="11" fill="#4E6B22"/><text class="num" x="316" y="526.3" text-anchor="middle">5</text>
  <rect x="684" y="522" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="547" text-anchor="middle">accept-art</text>
  <text class="sub" x="824" y="566" text-anchor="middle">检查格式，复制到素材目录</text>
  <path class="flow" d="M314 552H278" marker-end="url(#a)"/>
  <path class="flow" d="M616 552H682" marker-end="url(#a)"/>

  <!-- 6: appearance through the host interface -->
  <rect x="28" y="642" width="944" height="146" rx="10" fill="#6E8A3C" fill-opacity="0.08" stroke="#6E8A3C" stroke-dasharray="5 4"/>
  <text class="layer" x="466" y="662" text-anchor="middle" fill="#4E6B22">宿主接口</text>
  <rect x="36" y="672" width="240" height="104" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="708" text-anchor="middle">Pet Avatar</text>
  <text class="sub" x="156" y="728" text-anchor="middle">本地条目 · 云端 Pet，Dots 里是同一只</text>
  <text class="sub" x="156" y="744" text-anchor="middle">每次都按 ID 查找</text>
  <rect x="684" y="672" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="700" text-anchor="middle">set-appearance → host-result</text>
  <text class="sub" x="824" y="721" text-anchor="middle">运行时先做自己的步骤，</text>
  <text class="sub" x="824" y="736" text-anchor="middle">其余的交给 Agent，</text>
  <text class="sub" x="824" y="751" text-anchor="middle">保存宿主的实际结果</text>
  <path class="port" d="M682 688H278" marker-end="url(#p)"/>
  <text class="sub" x="466" y="682" text-anchor="middle" fill="#4E6B22">运行时做的步骤：文件 · IPC · app-tools</text>
  <rect x="316" y="710" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="737" text-anchor="middle">换形象</text>
  <text class="sub" x="466" y="755" text-anchor="middle">其余步骤用宿主自带的工具做，做完回报</text>
  <rect x="334" y="701" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="713.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <rect x="548" y="701" width="58" height="18" rx="9" fill="#F3F3F0" stroke="#B7BFAE"/>
  <text class="pill" x="577" y="713.5" text-anchor="middle" fill="#4A5646">换形象时</text>
  <circle cx="316" cy="710" r="11" fill="#4E6B22"/><text class="num" x="316" y="714.3" text-anchor="middle">6</text>
  <path class="port" d="M682 740H618" marker-start="url(#p)" marker-end="url(#p)"/>
  <path class="port" d="M314 740H278" marker-end="url(#p)"/>

  <!-- 7 -->
  <rect x="316" y="804" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="825" text-anchor="middle">完成</text>
  <text class="sub" x="466" y="843" text-anchor="middle">宠物记录在这一步改变</text>
  <text class="sub" x="466" y="858" text-anchor="middle">摘出简介，写到同一个 cloud ID</text>
  <rect x="334" y="795" width="51" height="18" rx="9" fill="#FFFFFF" stroke="#9CB3DC"/>
  <text class="pill" x="359.5" y="807.5" text-anchor="middle" fill="#2F4A7A">主 skill</text>
  <circle cx="316" cy="804" r="11" fill="#4E6B22"/><text class="num" x="316" y="808.3" text-anchor="middle">7</text>
  <rect x="684" y="804" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="824" text-anchor="middle">finish-story · companion-brief</text>
  <text class="sub" x="824" y="841" text-anchor="middle">条件：宿主存的图与验收图一致；</text>
  <text class="sub" x="824" y="856" text-anchor="middle">memory、state 和历史一起保存</text>
  <path class="flow" d="M616 834H682" marker-end="url(#a)"/>
  <rect x="36" y="804" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="826" text-anchor="middle">云端同步</text>
  <text class="sub" x="156" y="844" text-anchor="middle">形象、名字和简介跟着 cloud ID</text>
  <text class="sub" x="156" y="858" text-anchor="middle">桌面和 Dots 看到的是同一只</text>
  <path class="flow" d="M314 834H278" marker-end="url(#a)"/>

  <!-- 8 -->
  <rect x="36" y="888" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9DB57A"/>
  <text class="name" x="156" y="908" text-anchor="middle">对话框</text>
  <text class="sub" x="156" y="926" text-anchor="middle">最终消息原样发出；</text>
  <text class="sub" x="156" y="941" text-anchor="middle">展示过的图不再嵌入</text>
  <rect x="316" y="888" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#6E8A3C"/>
  <text class="name" x="466" y="915" text-anchor="middle">讲给用户</text>
  <text class="sub" x="466" y="933" text-anchor="middle">按完成的故事来讲；只换状态时可以没有消息</text>
  <rect x="334" y="879" width="91" height="18" rx="9" fill="#D6E2F6" stroke="#9CB3DC"/>
  <text class="pill" x="379.5" y="891.5" text-anchor="middle" fill="#2F4A7A">StoryDesigner</text>
  <circle cx="316" cy="888" r="11" fill="#4E6B22"/><text class="num" x="316" y="892.3" text-anchor="middle">8</text>
  <rect x="684" y="888" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D8B978"/>
  <text class="cmd" x="824" y="913" text-anchor="middle">story-output</text>
  <text class="sub" x="824" y="932" text-anchor="middle">完成的故事和已保存的图片</text>
  <path class="flow" d="M682 918H618" marker-end="url(#a)"/>
  <path class="flow" d="M314 918H278" marker-end="url(#a)"/>
</svg>
