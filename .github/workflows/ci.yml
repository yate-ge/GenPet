name: GenPet checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The release gate exercises the official marketplace/install CLI.
      - run: npm install -g @openai/codex@0.157.0
      - run: npm run verify:release
      # plugins/genpet is what users install from GitHub; it must match the source.
      - name: Committed plugin is up to date
        run: |
          git status --porcelain -- plugins .agents
          test -z "$(git status --porcelain -- plugins .agents)" || { echo "Run npm run build:plugin and commit plugins/genpet"; exit 1; }
