<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>GenPet records</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>GenPet 记录</h1>
        <button id="stop">停止调试器</button>
      </header>
      <p id="identity"></p>
      <p>读取记录不会改变宠物。故事和图片的实际效果由用户验证。</p>
      <section>
        <h2>当前记录</h2>
        <pre id="record"></pre>
      </section>
      <section>
        <h2>宠物故事</h2>
        <div id="stories"></div>
      </section>
      <section>
        <h2>视觉素材</h2>
        <div id="art"></div>
      </section>
      <section id="native">
        <h2>原生 Pet 选择</h2>
        <select id="pets"></select
        ><button id="switch">切换选中 Pet</button>
        <pre id="selection"></pre>
      </section>
      <p id="error"></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
