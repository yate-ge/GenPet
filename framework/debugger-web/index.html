<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GenPet 调试台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>GenPet 调试台</h1>
        <span id="env" class="muted mono"></span>
      </div>
      <div class="tools">
        <button id="reload">重新读取</button>
        <button id="all-pets" class="quiet">本机所有宠物</button>
        <button id="theme" class="quiet" title="切换浅色/深色">◐</button>
        <button id="stop" class="quiet danger">关闭调试器</button>
      </div>
    </header>
    <div id="notice" role="status"></div>
    <main class="layout">
      <aside id="sidebar">
        <h2>本机 GenPet</h2>
        <nav id="records"></nav>
      </aside>
      <section id="content"></section>
    </main>
    <dialog id="all-dialog">
      <div class="dialog-head">
        <h2>本机所有宠物</h2>
        <button id="all-close" class="quiet">关闭</button>
      </div>
      <p class="muted">宿主上能读到的全部宠物，仅供参考；本机宿主的 GenPet 可以点「查看」打开。</p>
      <div id="all-body"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
