<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GenPet 调试台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>GenPet 调试台</h1>
      <span id="summary"></span>
      <span class="spacer"></span>
      <button id="reload">重新读取</button>
      <button id="stop">关闭调试器</button>
    </header>
    <p id="error" role="alert"></p>
    <p id="switch-result" role="status"></p>
    <main>
      <aside>
        <p id="selection"></p>
        <nav id="list"></nav>
        <p id="sources" class="muted"></p>
      </aside>
      <section id="detail"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
